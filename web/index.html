<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Melo's Ramen</title>
    <meta name="description" content="A simple one-page checklist and notes app." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="sheet" aria-label="Melo's Ramen checklist">
      <header class="sheet__header">
        <h1 class="sheet__title">MELO'S RAMEN</h1>
      </header>

      <section class="date-row" aria-label="Date">
        <div class="date-row__spacer" aria-hidden="true"></div>
        <div class="date-row__right">
          <div class="date-row__label">Date</div>
          <div class="date" id="dateDigits" aria-label="Date digits (DDMMYY)">
            <input class="date__digit" inputmode="numeric" pattern="[0-9]*" maxlength="1" aria-label="Date digit 1" />
            <input class="date__digit" inputmode="numeric" pattern="[0-9]*" maxlength="1" aria-label="Date digit 2" />
            <input class="date__digit" inputmode="numeric" pattern="[0-9]*" maxlength="1" aria-label="Date digit 3" />
            <input class="date__digit" inputmode="numeric" pattern="[0-9]*" maxlength="1" aria-label="Date digit 4" />
            <input class="date__digit" inputmode="numeric" pattern="[0-9]*" maxlength="1" aria-label="Date digit 5" />
            <input class="date__digit" inputmode="numeric" pattern="[0-9]*" maxlength="1" aria-label="Date digit 6" />
          </div>
        </div>
      </section>

      <section class="section" aria-label="Toppings">
        <h2 class="section__title">TOPPINGS</h2>
        <ul class="toppings" id="checklist" role="list"></ul>
      </section>

      <section class="section" aria-label="Notes">
        <div class="notes-head">
          <h2 class="section__title">NOTES</h2>
          <button class="text-btn" id="notesDoneBtn" type="button" aria-label="Done typing">
            DONE
          </button>
        </div>

        <label class="sr-only" for="notesInput">Notes</label>
        <textarea
          id="notesInput"
          class="notes"
          inputmode="text"
          enterkeyhint="done"
          autocomplete="off"
          autocapitalize="sentences"
          spellcheck="true"
          placeholder=""
          rows="10"
        ></textarea>
        <div class="save-hint" id="notesSavedHint" aria-live="polite"></div>
      </section>
    </main>

    <script src="./app.js" defer></script>
  </body>
</html>
